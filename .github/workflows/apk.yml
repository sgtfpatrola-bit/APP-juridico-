name: Compilar APK beta
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager 'platforms;android-35'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || sdkmanager 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Minha-Aprovacao-OAB-beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
